<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #28a745; /* Verde principal */
            padding: 25px;
            border-radius: 8px;
            width: 450px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: #fff;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: normal;
        }

        label {
            color: #fff;
            display: block;
            margin: 12px 0 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: #218838; /* Verde oscuro */
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registro de estudiantes</h2>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre">

        <label for="correo">Correo:</label>
        <input type="email" id="correo" placeholder="Ingrese su correo">

        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" placeholder="Ingrese su contraseña">

        <label for="genero">Género:</label>
        <select id="genero">
            <option>Masculino</option>
            <option>Femenino</option>
            <option>Otro</option>
        </select>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" placeholder="Escriba un mensaje"></textarea>

        <button type="submit">registrado</button>
    </div>
</body>
</html>
