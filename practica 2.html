    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #1f1f1f;
            color: white;
        }

        header{
            background: #111;
            padding: 20px;
        }

        nav{
            display: flex;

        }

        .perfil{
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .materias h2,
        .sobre h2,
        .contacto h2{
            color: #8a6dff;
            margin-bottom: 15px;
        }

        ul{
            margin-left: 25px;
            line-height: 35px;
            font-size: 18px;
        }

        .sobre{
            background: #2b2b2b;
            border-radius: 15px;
            margin-top: 30px;
        }

        .contacto{
            margin-top: 30px;
        }

        footer{
            background: #00bfff;
            height: 80px;
            margin-top: 40px;
        }
    </style>
</head>
