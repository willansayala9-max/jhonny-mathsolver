<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MathSolver - Grados</title>

    <style> 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #071321;
            color: white;
            padding: 25px;
            overflow-x: hidden;
        }

        /* FONDO */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #006eff;
            opacity: 0.08;
            filter: blur(120px);
            border-radius: 50%;
            top: -150px;
            right: -150px;
            z-index: -1;
        }

        /* BOTÓN ATRÁS */

        .volver {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #008cff;
            background: #0b1c2d;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
        }

        .volver:hover {
            background: #008cff;
            transform: scale(1.08);
        }

        /* ENCABEZADO */

        .encabezado {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 3px;
            color: white;
        }

        .logo span {
            color: #00aaff;
        }

        .subtitulo {
            margin-top: 8px;
            color: #8ea7bd;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .linea {
            width: 110px;
            height: 4px;
            background: #00aaff;
            border-radius: 10px;
            margin: 18px auto;
        }

        h2 {
            font-size: 32px;
            margin-top: 25px;
        }

        .descripcion {
            color: #9bb0c2;
            margin-top: 10px;
            font-size: 17px;
        }

        /* CONTENEDOR DE GRADOS */

        .grados {
            max-width: 1100px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px;
        }

        /* BURBUJAS */

        .grado {
            height: 220px;
            border-radius: 45%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-decoration: none;
            color: white;

            position: relative;

            transition: 0.3s;

            border: 3px solid;
        }

        .grado:hover {
            transform: translateY(-8px) scale(1.03);
        }

        .numero {
            font-size: 58px;
            font-weight: bold;
        }

        .nombre {
            font-size: 22px;
            font-weight: bold;
            margin-top: -3px;
        }

        .icono {
            font-size: 40px;
            margin-top: 15px;
        }

        /* 1 */

        .grado1 {
            background: linear-gradient(145deg, #063f91, #071f48);
            border-color: #00aaff;
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.25);
        }

        /* 2 */

        .grado2 {
            background: linear-gradient(145deg, #007c67, #063b36);
            border-color: #00e0b0;
            box-shadow: 0 0 25px rgba(0, 224, 176, 0.2);
        }

        /* 3 */

        .grado3 {
            background: linear-gradient(145deg, #6323c7, #261052);
            border-color: #a855ff;
            box-shadow: 0 0 25px rgba(168, 85, 255, 0.25);
        }

        /* 4 */

        .grado4 {
            background: linear-gradient(145deg, #b86600, #542d00);
            border-color: #ffb000;
            box-shadow: 0 0 25px rgba(255, 176, 0, 0.2);
        }

        /* 5 */

        .grado5 {
            background: linear-gradient(145deg, #b50067, #51002f);
            border-color: #ff2ba6;
            box-shadow: 0 0 25px rgba(255, 43, 166, 0.25);
        }

        /* 6 */

        .grado6 {
            background: linear-gradient(145deg, #007d8d, #073a42);
            border-color: #00d9ed;
            box-shadow: 0 0 25px rgba(0, 217, 237, 0.25);
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {

            .grados {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }

            .logo {
                font-size: 40px;
            }

            .grado {
                height: 190px;
            }
        }

        @media (max-width: 550px) {

            body {
                padding: 15px;
            }

            .volver {
                width: 45px;
                height: 45px;
                font-size: 23px;
                top: 15px;
                left: 15px;
            }

            .encabezado {
                margin-top: 70px;
            }

            .logo {
                font-size: 34px;
            }

            h2 {
                font-size: 26px;
            }

            .descripcion {
                font-size: 14px;
            }

            .grados {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .grado {
                height: 180px;
            }
        }
    </style>
</head>

<body>

    <!-- BOTÓN PARA VOLVER AL REGISTRO -->

    <button class="volver" onclick="volverRegistro()">←</button>


    <!-- ENCABEZADO -->

    <header class="encabezado">

        <div class="logo">
            MATH<span>SOLVER</span>
        </div>

        <div class="subtitulo">
            Aprende · Practica · Avanza
        </div>

        <div class="linea"></div>

        <h2>Selecciona tu grado</h2>

        <p class="descripcion">
            Elige el grado de secundaria en el que te encuentras
        </p>

    </header>


    <!-- GRADOS -->

    <main class="grados">

        <a href="primero.html" class="grado grado1">
            <div class="numero">1.º</div>
            <div class="nombre">Secundaria</div>
            <div class="icono">📖</div>
        </a>


        <a href="segundo.html" class="grado grado2">
            <div class="numero">2.º</div>
            <div class="nombre">Secundaria</div>
            <div class="icono">📖</div>
        </a>


        <a href="tercero.html" class="grado grado3">
            <div class="numero">3.º</div>
            <div class="nombre">Secundaria</div>
            <div class="icono">📖</div>
        </a>


        <a href="cuarto.html" class="grado grado4">
            <div class="numero">4.º</div>
            <div class="nombre">Secundaria</div>
            <div class="icono">📖</div>
        </a>


        <a href="quinto.html" class="grado grado5">
            <div class="numero">5.º</div>
            <div class="nombre">Secundaria</div>
            <div class="icono">📖</div>
        </a>


        <a href="sexto.html" class="grado grado6">
            <div class="numero">6.º</div>
            <div class="nombre">Secundaria</div>
            <div class="icono">📖</div>
        </a>

    </main>


    <script>

        function volverRegistro() {
            window.location.href = "index.html";
        }

    </script>

</body>
</html>
