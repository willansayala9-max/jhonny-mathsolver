<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MathSolver - Registro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #101820;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            background: #17232d;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }

        /* NOMBRE DE LA APLICACIÓN */

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #00aaff;
            font-size: 36px;
            letter-spacing: 3px;
        }

        .logo p {
            color: #9ba7b0;
            margin-top: 5px;
            font-size: 14px;
        }

        /* TÍTULO */

        .titulo {
            color: white;
            text-align: center;
            margin-bottom: 25px;
            font-size: 25px;
        }

        /* CAMPOS */

        .campo {
            margin-bottom: 17px;
        }

        .campo label {
            display: block;
            color: #00aaff;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 13px;
            border: 1px solid #344754;
            border-radius: 8px;
            background: #24333e;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #00aaff;
            box-shadow: 0 0 5px rgba(0, 170, 255, 0.4);
        }

        .campo input::placeholder {
            color: #89949c;
        }

        /* BOTÓN */

        .boton {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 9px;
            background: #00aaff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .boton:hover {
            background: #0088cc;
            transform: scale(1.02);
        }

        /* MENSAJE */

        #mensaje {
            text-align: center;
            margin-top: 18px;
            color: #00d084;
            font-weight: bold;
        }

        /* CELULARES */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .contenedor {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 30px;
            }

            .titulo {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <!-- NOMBRE DE MATHSOLVER -->

        <div class="logo">
            <h1>MATHSOLVER</h1>
            <p>Aprende matemáticas paso a paso</p>
        </div>

        <h2 class="titulo">Crear cuenta</h2>

        <!-- FORMULARIO -->

        <form id="registroForm">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input 
                    type="text" 
                    id="nombre" 
                    placeholder="Ingrese su nombre"
                    required>
            </div>

            <div class="campo">
                <label for="apellido">Apellido</label>
                <input 
                    type="text" 
                    id="apellido" 
                    placeholder="Ingrese su apellido"
                    required>
            </div>

            <div class="campo">
                <label for="fecha">Fecha de nacimiento</label>
                <input 
                    type="date" 
                    id="fecha"
                    required>
            </div>

            <div class="campo">
                <label for="edad">Edad</label>
                <input 
                    type="number" 
                    id="edad" 
                    placeholder="Ingrese su edad"
                    min="1"
                    max="100"
                    required>
            </div>

            <div class="campo">
                <label for="genero">Género</label>

                <select id="genero" required>
                    <option value="">Seleccione una opción</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="campo">
                <label for="ciudad">Ciudad</label>
                <input 
                    type="text" 
                    id="ciudad" 
                    placeholder="Ingrese su ciudad"
                    required>
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input 
                    type="email" 
                    id="correo" 
                    placeholder="Ingrese su correo"
                    required>
            </div>

            <div class="campo">
                <label for="vocacion">Vocación</label>

                <select id="vocacion" required>
                    <option value="">Seleccione una opción</option>
                    <option value="estudiante">Estudiante</option>
                    <option value="profesional">Profesional</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="campo">
                <label for="nick">Nombre o Nick</label>
                <input 
                    type="text" 
                    id="nick" 
                    placeholder="Ingrese su nombre o nick"
                    required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Ingrese su contraseña"
                    required>
            </div>

            <button type="submit" class="boton">
                Registrarse
            </button>
            <button type="button" class="boton" ><a href="GRADOS.html">acceder</a></button>

            <p id="mensaje"></p>

        </form>

    </div>


    <script>

        const formulario = document.getElementById("registroForm");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            mensaje.textContent = "Registro realizado correctamente";

        });

    </script>

</body>
</html>
